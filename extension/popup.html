<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Holder Quick Saver</title>
  <style>
    :root {
      --bg: #0a0c14;
      --card-bg: #121524;
      --accent: #6366f1;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      width: 340px;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
    }
    .title { font-size: 15px; font-weight: 700; }
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
    input, select, textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      color: #fff;
      border: none;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      margin-top: 4px;
    }
    .status {
      font-size: 12px;
      text-align: center;
      margin-top: 8px;
    }
    .success { color: #10b981; }
    .error { color: #ef4444; }
    .hidden { display: none !important; }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
    }
    .icon-btn:hover { color: #fff; }
    .user-badge {
      font-size: 11px;
      color: #a5b4fc;
      background: rgba(99, 102, 241, 0.15);
      padding: 2px 8px;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo">⚡</div>
      <div class="title">Holder Saver</div>
    </div>
    <div class="header-actions">
      <button id="serverConfigBtn" class="icon-btn" title="Server Settings">⚙️</button>
      <button id="logoutBtn" class="icon-btn hidden" title="Log Out">🚪</button>
    </div>
  </div>

  <!-- Server Config Section -->
  <div id="serverConfigSection" class="hidden" style="background: rgba(255,255,255,0.04); padding: 10px; borderRadius: 8px; margin-bottom: 12px;">
    <div class="form-group">
      <label for="serverUrlInput">API Server URL</label>
      <input type="text" id="serverUrlInput" placeholder="http://localhost:5000/api">
    </div>
    <button id="saveServerUrlBtn" class="btn" style="padding: 6px; font-size: 11px;">Save Server URL</button>
  </div>

  <!-- User Sync Badge -->
  <div id="userBadge" class="user-badge hidden">
    <span>Logged in as: <strong id="userName">User</strong></span>
    <span style="font-size: 9px; color: #10b981;">● Synced</span>
  </div>

  <!-- Login Section -->
  <div id="authSection">
    <h4 style="margin-bottom: 6px; font-size: 13px;">Sign In to Holder</h4>
    <p style="font-size: 11px; color: var(--muted); margin-bottom: 10px;">
      Log in here, or sign in on the website for automatic sync!
    </p>
    <form id="loginForm">
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn">Log In</button>
      <div id="authStatus" class="status"></div>
    </form>
  </div>

  <!-- Quick Saver Form Section -->
  <form id="saveForm" class="hidden">
    <div class="form-group">
      <label for="title">Title</label>
      <input type="text" id="title" required placeholder="Loading tab title...">
    </div>

    <div class="form-group">
      <label for="url">URL / Media Link</label>
      <input type="url" id="url" required placeholder="https://...">
    </div>

    <div class="form-group">
      <label for="folderId">Target Folder</label>
      <select id="folderId">
        <option value="">📁 Uncategorized</option>
      </select>
    </div>

    <div class="form-group">
      <label for="tags">Tags (comma separated)</label>
      <input type="text" id="tags" placeholder="youtube, brand, design">
    </div>

    <div class="form-group">
      <label for="notes">Notes / Comments</label>
      <textarea id="notes" rows="2" placeholder="Add quick notes..."></textarea>
    </div>

    <button type="submit" class="btn" id="saveBtn">Save to Vault</button>
    <div id="status" class="status"></div>
  </form>

  <script src="popup.js"></script>
</body>
</html>
